[mypy]
python_version = 3.10
warn_return_any = True
warn_unused_configs = True
ignore_missing_imports = False
show_error_codes = True

# Path to venv site-packages (parent directory - use forward slashes)
mypy_path = ../HNvenv/lib/site-packages

# With namespace packages
namespace_packages = True

# Ignore stubs/errors for third-party libraries if needed
[[mypy-scipy.*]]
ignore_missing_imports = True

[[mypy-numpy.*]]
ignore_missing_imports = True

[[mypy-matplotlib.*]]
ignore_missing_imports = True

[[mypy-networkx.*]]
ignore_missing_imports = True